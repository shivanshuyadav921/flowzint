version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: flowzint-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-flowzint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: flowzint-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: flowzint-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/chroma_store:/app/chroma_store
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    container_name: flowzint-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: flowzint-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run dev"]

volumes:
  postgres_data:
