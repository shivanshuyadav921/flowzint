version: "3.9"
services:
  backend:
    build: ./backend
    container_name: flowzint-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_store:/app/chroma_store
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./app.db

  frontend:
    build: ./frontend
    container_name: flowzint-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
